name: Dependabot lockfile

# Dependabot has no bun support: it edits package.json but never bun.lock. CI
# installs with --frozen-lockfile, so every Dependabot PR against the bun
# workspace dies at install before a single real check runs, and the PR sits
# red for reasons that have nothing to do with the dependency being bumped.
# This job regenerates bun.lock on those branches and pushes it back.
#
# `apps/raycast` is deliberately excluded: it is an npm project (see #466), and
# Dependabot updates package-lock.json itself. Running `bun install` there would
# write a bun.lock into a directory bun does not own.
#
# Runs from the default branch on a schedule rather than reacting to the
# Dependabot push. Two reasons: GITHUB_TOKEN is forced read-only on any workflow
# Dependabot triggers, and pull_request_target would mean running `bun install`
# for an untrusted dependency update while holding a write token.
#
# Requires a DEPENDABOT_LOCKFILE_TOKEN secret (fine-grained PAT, contents:write
# on this repo). GITHUB_TOKEN could do the push, but commits it authors do not
# trigger new workflow runs, so CI would never re-evaluate the PR — which is the
# entire point of the job.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Single PR number to fix (blank = all eligible open Dependabot PRs)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate bun.lock on Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Regenerate lockfiles
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_LOCKFILE_TOKEN }}
          SINGLE_PR: ${{ inputs.pr }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$SINGLE_PR" ]; then
            prs="$SINGLE_PR"
          else
            # Same-repo Dependabot npm branches only. A fork head would mean
            # running `bun install` against an outsider's package.json while
            # holding a write token.
            prs=$(gh pr list \
              --state open \
              --author "app/dependabot" \
              --json number,headRefName,headRepositoryOwner \
              --jq ".[]
                    | select(.headRepositoryOwner.login == \"$REPO_OWNER\")
                    | select(.headRefName | startswith(\"dependabot/npm_and_yarn/\"))
                    | select(.headRefName | startswith(\"dependabot/npm_and_yarn/apps/raycast\") | not)
                    | .number")
          fi

          if [ -z "$prs" ]; then
            echo "No eligible Dependabot PRs."
            exit 0
          fi

          failed=0
          for pr in $prs; do
            branch=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            echo "::group::PR #$pr ($branch)"

            # actions/checkout configures a narrow remote.origin.fetch refspec,
            # so origin/<branch> does not exist locally and `git checkout
            # <branch>` cannot create a tracking branch from it. Fetch the ref
            # explicitly and check out the fetched commit by hand.
            git fetch -q origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -q -B "$branch" "refs/remotes/origin/$branch"

            # No --frozen-lockfile: reconciling the lock to package.json is the
            # whole job. --ignore-scripts because this runs with a write token
            # and the dependency being installed is the thing under review.
            if ! bun install --ignore-scripts; then
              echo "::warning::bun install failed on #$pr — needs a human"
              failed=$((failed + 1))
              git checkout -q --force .
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet -- bun.lock; then
              echo "bun.lock already in sync on #$pr"
            else
              git add bun.lock
              git commit -q -m "chore(deps): regenerate bun.lock" \
                -m "Dependabot cannot update bun.lock, so the frozen-lockfile install in CI failed before any real check could run."
              git push -q origin "HEAD:refs/heads/$branch"
              echo "Pushed regenerated bun.lock to #$pr"
            fi

            # Drop any non-lockfile churn (postinstall artefacts, .env writes)
            # so the next iteration's checkout starts from a clean tree.
            git checkout -q --force .
            echo "::endgroup::"
          done

          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed PR(s) could not be reconciled automatically"
          fi
