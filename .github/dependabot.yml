version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Bun workspace. `apps/raycast` is deliberately absent: it is an npm project
  # with its own package-lock.json (the Raycast Store requires npm), so it gets
  # its own entry below. Listing it here made Dependabot try to npm-resolve a
  # directory bun owns, which failed silently and left its advisories unpatched.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/friends"
      - "/apps/fumadocs"
      - "/apps/sandbox-worker"
      - "/apps/server"
      - "/apps/web"
      - "/apps/zero-cache"
      - "/packages/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # rebase-strategy left at the default (auto). It was previously disabled,
    # which let branches rot: a PR opened against an older main eventually
    # conflicts, and GitHub cannot compute a merge commit for a conflicted PR,
    # so `pull_request` workflows stop running entirely. #401 and #384 sat in
    # that state since early June — not failing, simply never evaluated.
    #
    # IMPORTANT, and not obvious: once the dependabot-lockfile workflow pushes a
    # regenerated bun.lock to a PR, Dependabot considers that PR edited by a
    # third party and refuses to touch it again:
    #
    #     Looks like this PR has been edited by someone other than Dependabot.
    #     That means Dependabot can't rebase it - sorry!
    #
    # So auto-rebase only ever applies to PRs the workflow has not reached yet.
    # A lockfile-fixed PR cannot be rebased; if it goes stale, comment
    # `@dependabot recreate` (which overwrites edits) rather than
    # `@dependabot rebase` (which refuses). Grouped updates are unaffected —
    # Dependabot recreates those wholesale instead of rebasing them.
    #
    # Practical consequence: a lockfile-fixed PR is perishable. Merge it while
    # it is current, or recreate it. Do not expect Dependabot to maintain it.
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@rocicorp/zero"

  # Raycast extension: standalone npm project, outside the bun workspace.
  # Separate entry so its PR budget is not consumed by the monorepo group, and
  # so Dependabot resolves it with npm against its own package-lock.json.
  - package-ecosystem: npm
    directory: "/apps/raycast"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # Also left at the default, for the same reason. Dependabot maintains this
    # package-lock.json itself, so a rebase here needs no help from the
    # lockfile workflow.
    groups:
      raycast:
        patterns: ["*"]
    commit-message:
      prefix: "deps(raycast)"
