version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Bun workspace. `apps/raycast` is deliberately absent: it is an npm project
  # with its own package-lock.json (the Raycast Store requires npm), so it gets
  # its own entry below. Listing it here made Dependabot try to npm-resolve a
  # directory bun owns, which failed silently and left its advisories unpatched.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/apps/friends"
      - "/apps/fumadocs"
      - "/apps/sandbox-worker"
      - "/apps/server"
      - "/apps/web"
      - "/apps/zero-cache"
      - "/packages/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # rebase-strategy left at the default (auto). It was previously disabled,
    # which let branches rot: a PR opened against an older main eventually
    # conflicts, and GitHub cannot compute a merge commit for a conflicted PR,
    # so `pull_request` workflows stop running entirely. #401 and #384 sat in
    # that state since early June — not failing, simply never evaluated.
    #
    # Disabling it was defensible while every Dependabot PR was dead on arrival
    # at `bun install --frozen-lockfile`; rebasing would only have churned PRs
    # that could not pass anyway. The dependabot-lockfile workflow now
    # reconciles bun.lock daily, so a rebase that drops the bot's lockfile
    # commit is repaired on the next run.
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@rocicorp/zero"

  # Raycast extension: standalone npm project, outside the bun workspace.
  # Separate entry so its PR budget is not consumed by the monorepo group, and
  # so Dependabot resolves it with npm against its own package-lock.json.
  - package-ecosystem: npm
    directory: "/apps/raycast"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # Also left at the default, for the same reason. Dependabot maintains this
    # package-lock.json itself, so a rebase here needs no help from the
    # lockfile workflow.
    groups:
      raycast:
        patterns: ["*"]
    commit-message:
      prefix: "deps(raycast)"
